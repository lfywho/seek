<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar Vaga</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/adicionar_vaga.css" />
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" />
</head>

<body data-active-nav="criar" id="todo">
    <header class="cabecalho"></header>

    <main class="adicionar-projeto adicionar-vaga">
        <div class="adicionar-projeto__page">
            <div class="adicionar-projeto__layout">
                <section class="adicionar-projeto__main" aria-label="Formulário da vaga">
                    <section
                        class="adicionar-projeto__panel adicionar-projeto__section adicionar-projeto__title-section">
                        <input class="adicionar-projeto__title-input" type="text" id="tituloVaga"
                            placeholder="Título da vaga (opcional)" autocomplete="off" />
                    </section>

                    <section class="adicionar-projeto__panel adicionar-projeto__section">
                        <h2 class="adicionar-projeto__section-title">Descrição da vaga</h2>
                        <textarea class="adicionar-projeto__text-area" id="descricaoVaga" rows="6" maxlength="1500"
                            placeholder="Descreva responsabilidades, requisitos e benefícios... (opcional)"></textarea>
                        <div class="adicionar-projeto__counter" aria-live="polite">
                            <span id="descricaoVagaCounter">0</span>/1500
                        </div>
                    </section>

                    <section
                        class="adicionar-projeto__panel adicionar-projeto__section adicionar-projeto__section--categorias">
                        <h2 class="adicionar-projeto__section-title adicionar-projeto__section-title--large">Categorias
                        </h2>
                        <div class="adicionar-projeto__chips" id="chips-categorias-vaga"></div>
                        <div class="adicionar-projeto__section-spacer"></div>

                        <div class="adicionar-projeto__search-block">
                            <h2 class="adicionar-projeto__section-title adicionar-projeto__section-title--medium">
                                Pesquisar</h2>
                            <div class="adicionar-projeto__search-box">
                                <input type="text" id="pesquisaCategoriaVaga" placeholder="Pesquisar categorias"
                                    autocomplete="off">
                            </div>
                        </div>
                    </section>
                </section>

                <aside class="adicionar-projeto__sidebar" aria-label="Configurações da vaga">
                    <h1 class="adicionar-projeto__page-heading">Configurações</h1>

                    <section class="adicionar-projeto__panel adicionar-projeto__sidebar-card">
                        <h2 class="adicionar-projeto__sidebar-title">Link da vaga</h2>
                        <label class="adicionar-projeto__field-label" for="linkVaga">URL do LinkedIn</label>
                        <input class="adicionar-projeto__text-input" type="url" id="linkVaga"
                            placeholder="https://www.linkedin.com/jobs/view/..." inputmode="url" autocomplete="off" />
                        <p class="adicionar-projeto__helper">Informe o link público da vaga no LinkedIn.</p>
                    </section>

                    <section class="adicionar-projeto__panel adicionar-projeto__sidebar-card">
                        <div class="adicionar-projeto__stack-gap">
                            <button class="adicionar-projeto__sidebar-button" type="button" id="publicarVaga">
                                <span>Publicar Vaga</span>
                            </button>
                        </div>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <!-- Estrutura do Modal de Avisos -->
    <div id="modalSistema" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-content">
            <h3 id="modalTitulo" class="modal-title">Aviso</h3>
            <p id="modalMensagem" class="modal-text">Sua mensagem vai aqui.</p>
            <div class="modal-actions">
                <button type="button" id="modalBtnCancelar"
                    class="modal-btn modal-btn--secondary hidden">Cancelar</button>
                <button type="button" id="modalBtnConfirmar" class="modal-btn modal-btn--primary">OK</button>
            </div>
        </div>
    </div>

    <script src="js/ambiente.js"></script>
    <script src="js/header.js"></script>
    <script src="js/usuario_logado.js"></script>
    <script src="js/conexao_com_api/adicionar_vaga.js"></script>
    <script src="js/adicionar_vaga.js"></script>
</body>

</html>
