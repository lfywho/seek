<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek | Contato</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/Landing-page/imgs/favicon.svg">
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html" aria-label="Seek - início"><img
                src="imgs/logo_com_nome.svg" alt="Seek"></a>
        <nav class="main-nav" aria-label="Navegação principal"><a href="nossa_missao.html">Nossa missão</a><a
                href="index.html">Explorar</a><a href="quem_somos..html">Sobre nós</a><a href="contato.html"
                aria-current="page">Contato</a><a href="index.html#beneficios">Assinatura</a></nav><span
            class="header-actions"><a class="login-button" href="../login.html">Entrar</a></div>
    </header>
    <main class="page-shell contact-grid">
        <section class="contact-copy">
            <h1>Contato</h1>
            <div class="eyebrow-line"></div>
            <p>Tem alguma dúvida, sugestão ou quer falar com a gente? Preencha o formulário ou envie um e-mail. Vamos
                adorar conversar e sanar a dúvida de vocês!</p>
            <div class="contact-details">
                <div class="contact-detail"><img src="imgs/email.svg" alt="">
                    <div>Email<span>hello@luminary.io</span></div>
                </div>
                <div class="contact-detail"><img src="imgs/telefone.svg" alt="">
                    <div>Phone<span>(16) 9999-9999</span></div>
                </div>
                <div class="contact-detail"><img src="imgs/local.svg" alt="">
                    <div>Address<span>Matão, SP - Brasil</span></div>
                </div>
            </div>
        </section>
        <form class="contact-form" action="#" method="post"><input type="text" name="nome" placeholder="Nome completo"
                aria-label="Nome completo" required><input type="email" name="email" placeholder="Email"
                aria-label="Email" required><input type="text" name="assunto" placeholder="Assunto" aria-label="Assunto"
                required><textarea name="mensagem" placeholder="Mensagem" aria-label="Mensagem" required></textarea>
            <div class="form-action"><button class="button" type="submit">Enviar mensagem</button></div>
        </form>
    </main>
<script src="nav-transition.js"></script>
</body>
</html>
